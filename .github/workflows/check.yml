name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: integrations/dutctl/go.mod
          cache: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target thumbv6m-none-eabi --target thumbv7m-none-eabi
          rustup toolchain install nightly --profile minimal --component rust-src
      - name: Protocol, core, host and Go adapter tests
        run: ./dev test
      - name: Formatting, Clippy and all firmware targets
        run: ./dev check
