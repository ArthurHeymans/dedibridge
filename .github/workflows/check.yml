name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: integrations/dutctl/go.mod
          cache: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy \
            --target thumbv6m-none-eabi --target thumbv7m-none-eabi
          rustup toolchain install nightly --profile minimal \
            --component rust-src --component clippy
      - name: Protocol, core, host, task runner and Go adapter tests
        run: cargo xtask test
      - name: Formatting, Clippy and all firmware targets
        run: cargo xtask check
      - name: Package board firmware
        run: |
          cargo install elf2uf2-rs --version 2.2.0 \
            --no-default-features --locked
          cargo xtask artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: dedibridge-firmware
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dedibridge-firmware
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
