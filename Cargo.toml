[workspace]
members = ["crates/*", "boards/*", "tools/*", "xtask"]
default-members = ["crates/protocol", "crates/firmware-core", "tools/dedibridgectl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dedi-protocol = { path = "crates/protocol" }
dedi-core = { path = "crates/firmware-core" }
embassy-executor = "0.10"
embassy-usb = { version = "0.6", default-features = false, features = ["max-interface-count-2", "max-handler-count-1"] }
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-futures = "0.1"
embedded-hal = "1.0"
critical-section = "1.2"
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2"
defmt = "1"
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"] }
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
debug = 2
lto = true
opt-level = "s"
codegen-units = 1
