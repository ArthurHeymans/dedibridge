<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 940" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi Pico — DediBridge pinout</title>
<desc id="desc">RP2040 · component side · USB at top · numbers are physical header pins. Functions are labeled in text and grouped by color. See the board guide for wiring precautions and a text pin table.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172b3a; }
.paper { fill: #f8fafc; stroke: #d8e2eb; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #527084; }
.title { font-size: 32px; font-weight: 750; }
.subtitle { font-size: 16px; fill: #526777; }
.label { font-size: 15px; font-weight: 600; }
.pin { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 700; }
.number { font-family: ui-monospace, monospace; font-size: 12px; fill: #526777; }
.muted { fill: #647988; }
.panel { fill: white; stroke: #d8e2eb; }
.board { fill: #15584d; stroke: #0e4038; stroke-width: 2; }
.board-text { fill: #f0fdf4; font-size: 15px; font-weight: 700; }
.chip { fill: #213541; stroke: #8bb3ab; }
.spi rect, .spi circle { fill: #dbeafe; stroke: #93b6df; }
.spi text { fill: #17477b; }
.uart rect, .uart circle { fill: #e0e7ff; stroke: #aaaee1; }
.uart text { fill: #373b83; }
.control rect, .control circle { fill: #fef3c7; stroke: #dfc77d; }
.control text { fill: #72500c; }
.led rect, .led circle { fill: #fce7f3; stroke: #dbadca; }
.led text { fill: #833d67; }
.power rect, .power circle { fill: #dcfce7; stroke: #91c4a1; }
.power text { fill: #255d38; }
.usb rect, .usb circle { fill: #cffafe; stroke: #83c7d0; }
.usb text { fill: #165d68; }
.idle rect, .idle circle { fill: #edf2f6; stroke: #d8e2eb; }
.idle text { fill: #526777; }
</style>
